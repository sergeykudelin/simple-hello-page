<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello from Serhii</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --fg: #e7ecf3;
      --muted: #9aa7b8;
      --accent: #6ea8fe;
      --card: #171d25;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f9;
        --fg: #15202b;
        --muted: #5b6b7c;
        --accent: #2563eb;
        --card: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(110, 168, 254, 0.25), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(167, 139, 250, 0.2), transparent 55%),
        var(--bg);
      color: var(--fg);
      padding: 1.5rem;
    }
    main {
      width: min(36rem, 100%);
      background: var(--card);
      border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
      border-radius: 1.25rem;
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Live</span>
    <h1>Hello, Serhii</h1>
    <p>This is a simple public page built for you. Clean, shareable, and ready to open anywhere.</p>
  </main>
</body>
</html>
